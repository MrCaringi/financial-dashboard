services:
  dashboard:
    image: ghcr.io/giorobert88/financial-dashboard:latest
    container_name: firefly-dashboard
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - .env.local
    environment:
      - AUTH_FILE_PATH=/app/data/.dashboard_auth
    volumes:
      - dashboard_data:/app/data

volumes:
  dashboard_data:
